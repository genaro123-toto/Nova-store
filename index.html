<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nova Store</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: white;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.search {
    width: 40%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.whatsapp {
    background: #25D366;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
}

/* VIDEO */
.video {
    height: 300px;
    margin: 20px;
    background: #ddd;
    border-radius: 10px;
}

/* OFERTA */
.oferta {
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
    font-weight: bold;
}

/* PRODUCTOS */
.productos {
    display: flex;
    justify-content: space-around;
    padding: 20px;
}

.card {
    background: white;
    padding: 15px;
    width: 200px;
    text-align: center;
    border-radius: 10px;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.btn {
    margin-top: 10px;
    display: inline-block;
    background: #25D366;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    text-decoration: none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">Nova Store</div>
    <input class="search" placeholder="Buscar productos...">
    <a class="whatsapp" href="https://wa.me/5492964609317">WhatsApp</a>
</div>

<!-- VIDEO -->
<div class="video"></div>

<!-- OFERTA -->
<div class="oferta">20% DE DESCUENTO EN TU PRIMERA COMPRA</div>

<!-- PRODUCTOS -->
<div class="productos">

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Smartwatch S</h3>
        <p>$20.000</p>
        <a class="btn" href="https://wa.me/5492964609317?text=Hola quiero consultar por el Smartwatch">Consultar</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Auriculares</h3>
        <p>$16.000</p>
        <a class="btn" href="https://wa.me/5492964609317?text=Hola quiero consultar por auriculares">Consultar</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Mousepad</h3>
        <p>$25.000</p>
        <a class="btn" href="https://wa.me/5492964609317?text=Hola quiero consultar por mousepad">Consultar</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Funda</h3>
        <p>$10.000</p>
        <a class="btn" href="https://wa.me/5492964609317?text=Hola quiero consultar por funda">Consultar</a>
    </div>

</div>

</body>
</html>
