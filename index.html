<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Tienda</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

/* HEADER */

header{
    background:#111;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.cart-btn{
    background:#ff9800;
    border:none;
    padding:12px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

/* HERO */

.hero{
    height:350px;
    background:linear-gradient(
    rgba(0,0,0,.5),
    rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:45px;
}

.hero p{
    margin-top:15px;
    font-size:20px;
}


/* BUSCADOR */

.search{
    padding:25px;
    text-align:center;
}

.search input{
    width:80%;
    max-width:500px;
    padding:15px;
    border-radius:30px;
    border:1px solid #ccc;
}


/* PRODUCTOS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    padding:30px;
}


.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px #0002;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}


.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}


.card-content{
    padding:20px;
}


.price{
    color:#ff9800;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}


button{
    cursor:pointer;
}


.add{
    width:100%;
    padding:12px;
    background:#111;
    color:white;
    border:none;
    border-radius:10px;
}

.add:hover{
    background:#ff9800;
}


/* CARRITO */

.cart{
    position:fixed;
    right:-400px;
    top:0;
    width:350px;
    height:100%;
    background:white;
    box-shadow:-5px 0 15px #0003;
    padding:20px;
    transition:.4s;
    z-index:200;
    overflow:auto;
}


.cart.active{
    right:0;
}


.cart h2{
    margin-bottom:20px;
}


.product-cart{
    border-bottom:1px solid #ddd;
    padding:15px 0;
}


.product-cart button{
    padding:5px 10px;
    margin:5px;
}


.total{
    font-size:25px;
    font-weight:bold;
    margin:20px 0;
}


.buy{
    background:#25d366;
    color:white;
    padding:15px;
    border:none;
    width:100%;
    border-radius:10px;
}


/* FOOTER */

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:30px;
}


@media(max-width:500px){

.hero h1{
    font-size:32px;
}

.cart{
    width:100%;
}

}

</style>

</head>

<body>


<header>

<div class="logo">
Mi Tienda
</div>

<button class="cart-btn" onclick="openCart()">
🛒 Carrito (<span id="count">0</span>)
</button>

</header>


<section class="hero">

<div>
<h1>Comprá fácil y rápido</h1>
<p>Productos de calidad al mejor precio</p>
</div>

</section>


<div class="search">

<input 
type="text"
id="search"
placeholder="Buscar productos..."
onkeyup="searchProducts()">

</div>



<section class="products" id="products">


<div class="card">

<img src="https://via.placeholder.com/400">

<div class="card-content">

<h3>Producto 1</h3>

<p>Descripción del producto</p>

<div class="price">
$10.000
</div>

<button class="add" onclick="addProduct('Producto 1',10000)">
Agregar al carrito
</button>

</div>

</div>


<div class="card">

<img src="https://via.placeholder.com/400">

<div class="card-content">

<h3>Producto 2</h3>

<p>Descripción del producto</p>

<div class="price">
$15.000
</div>

<button class="add" onclick="addProduct('Producto 2',15000)">
Agregar al carrito
</button>

</div>

</div>


<div class="card">

<img src="https://via.placeholder.com/400">

<div class="card-content">

<h3>Producto 3</h3>

<p>Descripción del producto</p>

<div class="price">
$20.000
</div>

<button class="add" onclick="addProduct('Producto 3',20000)">
Agregar al carrito
</button>

</div>

</div>


</section>
<!-- CARRITO -->

<div class="cart" id="cart">

<h2>🛒 Tu carrito</h2>

<div id="cart-items"></div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button class="buy" onclick="buyWhatsApp()">
Comprar por WhatsApp
</button>

<br><br>

<button onclick="closeCart()">
Cerrar
</button>

</div>



<footer>

<p>© 2026 Mi Tienda - Todos los derechos reservados</p>

</footer>



<script>

let cart = [];


/* ABRIR Y CERRAR CARRITO */

function openCart(){

document.getElementById("cart").classList.add("active");

}


function closeCart(){

document.getElementById("cart").classList.remove("active");

}



/* AGREGAR PRODUCTOS */

function addProduct(name,price){

let product = cart.find(item => item.name === name);


if(product){

product.quantity++;

}else{

cart.push({

name:name,
price:price,
quantity:1

});

}


updateCart();

}



/* ACTUALIZAR CARRITO */

function updateCart(){


let container = document.getElementById("cart-items");

container.innerHTML="";


let total=0;

let count=0;


cart.forEach((item,index)=>{


total += item.price * item.quantity;

count += item.quantity;


container.innerHTML += `

<div class="product-cart">

<h3>${item.name}</h3>

<p>$${item.price}</p>


<button onclick="changeQuantity(${index},-1)">
➖
</button>


<span>
${item.quantity}
</span>


<button onclick="changeQuantity(${index},1)">
➕
</button>


<button onclick="removeProduct(${index})">
❌
</button>


</div>

`;

});


document.getElementById("total").innerText=total;

document.getElementById("count").innerText=count;


}



/* CAMBIAR CANTIDAD */

function changeQuantity(index,value){

cart[index].quantity += value;


if(cart[index].quantity <=0){

cart.splice(index,1);

}


updateCart();

}



/* ELIMINAR PRODUCTO */

function removeProduct(index){

cart.splice(index,1);

updateCart();

}



/* BUSCADOR */

function searchProducts(){


let input=document
.getElementById("search")
.value
.toLowerCase();


let cards=document
.querySelectorAll(".card");


cards.forEach(card=>{


let text=card.innerText.toLowerCase();


if(text.includes(input)){

card.style.display="block";

}else{

card.style.display="none";

}


});


}



/* WHATSAPP */

function buyWhatsApp(){


let message="Hola, quiero comprar:%0A%0A";


cart.forEach(item=>{


message += 
`${item.name} x${item.quantity} - $${item.price * item.quantity}%0A`;

});


message += `%0ATotal: $${document.getElementById("total").innerText}`;


// CAMBIÁ ESTE NÚMERO POR EL TUYO

let phone="5490000000000";


window.open(
"https://wa.me/"+phone+"?text="+message
);


}



</script>


</body>

</html>
<script>


// ===============================
// PERSONALIZACIÓN DE TIENDA
// ===============================

// Cambia aquí el nombre de tu tienda
document.querySelector(".logo").innerHTML="🔥 Mi Tienda Oficial";


// ===============================
// PRODUCTOS CON IMÁGENES PROPIAS
// ===============================
//
// Para poner tus fotos:
// cambiá en los productos:
// https://via.placeholder.com/400
//
// por una imagen tuya, ejemplo:
// imagenes/remera.jpg
//
// o un link de internet.



// ===============================
// ANIMACIÓN AL CARGAR
// ===============================

window.onload=function(){

let cards=document.querySelectorAll(".card");

cards.forEach((card,index)=>{

setTimeout(()=>{

card.style.opacity="1";
card.style.transform="translateY(0)";

},index*150);


});

};



// ===============================
// ALERTA AL AGREGAR
// ===============================

let oldAddProduct=addProduct;

addProduct=function(name,price){

oldAddProduct(name,price);

mostrarAviso(name);

}



function mostrarAviso(producto){

let aviso=document.createElement("div");


aviso.innerHTML=
"✅ "+producto+" agregado al carrito";


aviso.style.position="fixed";
aviso.style.bottom="20px";
aviso.style.left="50%";
aviso.style.transform="translateX(-50%)";
aviso.style.background="#111";
aviso.style.color="white";
aviso.style.padding="15px 25px";
aviso.style.borderRadius="30px";
aviso.style.zIndex="500";


document.body.appendChild(aviso);


setTimeout(()=>{

aviso.remove();

},2000);


}



// ===============================
// GUARDAR CARRITO
// ===============================

let savedCart=localStorage.getItem("carrito");


if(savedCart){

cart=JSON.parse(savedCart);

updateCart();

}



let oldUpdate=updateCart;


updateCart=function(){

oldUpdate();

localStorage.setItem(
"carrito",
JSON.stringify(cart)
);

}




// ===============================
// MODO OSCURO
// ===============================

let dark=false;


function darkMode(){

dark=!dark;


if(dark){

document.body.style.background="#111";
document.body.style.color="white";


}else{

document.body.style.background="#f5f5f5";
document.body.style.color="#222";

}


}


// ===============================
// BOTÓN MODO OSCURO
// ===============================

let darkButton=document.createElement("button");

darkButton.innerHTML="🌙";

darkButton.style.position="fixed";
darkButton.style.bottom="20px";
darkButton.style.right="20px";
darkButton.style.width="50px";
darkButton.style.height="50px";
darkButton.style.borderRadius="50%";
darkButton.style.border="none";
darkButton.style.background="#ff9800";
darkButton.style.fontSize="22px";
darkButton.style.zIndex="300";


darkButton.onclick=darkMode;


document.body.appendChild(darkButton);




// ===============================
// CONTADOR DE VISITAS
// ===============================

let visits=localStorage.getItem("visitas");


if(!visits){

visits=0;

}


visits++;


localStorage.setItem(
"visitas",
visits
);



// ===============================
// BOTÓN VOLVER ARRIBA
// ===============================

let topButton=document.createElement("button");


topButton.innerHTML="⬆";


topButton.style.position="fixed";
topButton.style.bottom="80px";
topButton.style.right="20px";
topButton.style.width="45px";
topButton.style.height="45px";
topButton.style.borderRadius="50%";
topButton.style.border="none";
topButton.style.background="#111";
topButton.style.color="white";
topButton.style.display="none";
topButton.style.zIndex="300";


topButton.onclick=function(){

window.scrollTo({

top:0,
behavior:"smooth"

});

};


document.body.appendChild(topButton);



window.onscroll=function(){

if(window.scrollY>300){

topButton.style.display="block";

}else{

topButton.style.display="none";

}

};



</script>
