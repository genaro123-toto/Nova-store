<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nova Store</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }

header {
  background:black;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
}

.banner {
  background:orange;
  text-align:center;
  padding:10px;
  font-weight:bold;
}

#buscador {
  width:90%;
  margin:15px auto;
  display:block;
  padding:10px;
  font-size:16px;
}

.productos {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.producto {
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.producto img { width:100%; }

.boton {
  background:black;
  color:white;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
  border:none;
}

#carrito {
  background:white;
  padding:15px;
  margin:20px;
  border-radius:10px;
}

.eliminar {
  background:red;
  color:white;
  border:none;
  cursor:pointer;
  margin-left:5px;
}

.cantidad {
  margin-left:5px;
}
</style>
</head>

<body>

<header>Nova Store</header>
<div class="banner">🔥 Ofertas de hoy - Envíos gratis 🔥</div>

<input id="buscador" placeholder="Buscar productos..." onkeyup="buscar()">

<div id="carrito">
<h2>Carrito</h2>
<ul id="lista-carrito"></ul>
<p>Total: $<span id="total">0</span></p>
<button onclick="vaciarCarrito()">Vaciar carrito</button>
</div>

<div class="productos" id="productos">

<div class="producto" data-nombre="reloj">
<img src="https://via.placeholder.com/200">
<h3>Reloj inteligente</h3>
<p>$20000</p>
<button class="boton" onclick="agregarProducto('Reloj inteligente',20000)">Comprar</button>
</div>

<div class="producto" data-nombre="funda">
<img src="https://via.placeholder.com/200">
<h3>Funda celular</h3>
<p>$5000</p>
<button class="boton" onclick="agregarProducto('Funda celular',5000)">Comprar</button>
</div>

<div class="producto" data-nombre="auriculares">
<img src="https://via.placeholder.com/200">
<h3>Auriculares</h3>
<p>$15000</p>
<button class="boton" onclick="agregarProducto('Auriculares',15000)">Comprar</button>
</div>

<div class="producto" data-nombre="teclado">
<img src="https://via.placeholder.com/200">
<h3>Teclado gamer</h3>
<p>$30000</p>
<button class="boton" onclick="agregarProducto('Teclado gamer',30000)">Comprar</button>
</div>

</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

function guardar() {
  localStorage.setItem("carrito", JSON.stringify(carrito));
}

function render() {
  let lista = document.getElementById("lista-carrito");
  lista.innerHTML = "";
  let total = 0;

  carrito.forEach((p, i) => {
    let li = document.createElement("li");

    li.innerHTML = p.nombre + " x" + p.cantidad + " - $" + (p.precio*p.cantidad) +
      ' <button onclick="cambiarCantidad('+i+',1)">+</button>' +
      ' <button onclick="cambiarCantidad('+i+',-1)">-</button>' +
      ' <button class="eliminar" onclick="eliminar('+i+')">X</button>';

    lista.appendChild(li);
    total += p.precio * p.cantidad;
  });

  document.getElementById("total").textContent = total;
}

function agregarProducto(nombre, precio) {
  let prod = carrito.find(p => p.nombre === nombre);
  if (prod) prod.cantidad++;
  else carrito.push({nombre, precio, cantidad:1});

  guardar();
  render();
}

function cambiarCantidad(i, cambio) {
  carrito[i].cantidad += cambio;
  if (carrito[i].cantidad <= 0) carrito.splice(i,1);
  guardar();
  render();
}

function eliminar(i) {
  carrito.splice(i,1);
  guardar();
  render();
}

function vaciarCarrito() {
  carrito = [];
  guardar();
  render();
}

function buscar() {
  let valor = document.getElementById("buscador").value.toLowerCase();
  let productos = document.querySelectorAll(".producto");

  productos.forEach(p => {
    let nombre = p.getAttribute("data-nombre");
    p.style.display = nombre.includes(valor) ? "block" : "none";
  });
}

render();
</script>

</body>
</html>
