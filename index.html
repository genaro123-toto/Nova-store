<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nova Store</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }
    .banner {
      background: orange;
      color: black;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }
    .productos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }
    .producto {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .producto img {
      width: 100%;
      border-radius: 10px;
    }
    .boton {
      background: black;
      color: white;
      padding: 10px;
      display: inline-block;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>Nova Store</header>

<div class="banner">🔥Ofertas de hoy - descuento del 20%🔥</div>

<div class="productos">

  <button onclick="agregarProducto('Reloj inteligente')">Comprar</button>

 
  <button onclick="agregarProducto('Funda para celular')">Comprar</button>

  <button onclick="agregarProducto('Auriculares inalámbricos')">Comprar</button>
  
</div>
<script>
let carrito = [];

function agregarProducto(nombre) {
  carrito.push(nombre);
  alert(nombre + " agregado al carrito");
}
</script>
</body>
</html>
