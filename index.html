<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}
body{
    background:#fff;
    color:#111;
}
/* NAV */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}
.logo{
    font-weight:bold;
    font-size:26px;
    letter-spacing:1px;
}
nav a{
    margin-left:20px;
    text-decoration:none;
    color:#555;
}
/* DESCUENTO */
.top-banner{
    text-align:center;
    padding:8px;
    background:#111;
    color:#fff;
    font-size:14px;
}
/* HERO */
.hero{
    height:55vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding-top:60px;
    text-align:center;
}
.hero h1{
    font-size:36px;
    margin-bottom:15px;
    font-weight:500;
}
.search-box{
    width:450px;
    max-width:90%;
    padding:14px;
    border-radius:30px;
    border:1px solid #ddd;
    outline:none;
}
.search-box:focus{
    border-color:#c8a27c;
}
/* PRODUCTOS */
.productos{
    padding:20px 40px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:40px;
}
.card{
    transition:0.3s;
}
.card:hover{
    transform:translateY(-5px);
}
.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:10px;
}
.card-content{
    padding:10px 5px;
}
.precio{
    color:#c8a27c;
    margin:5px 0 10px;
}
.btn{
    padding:8px 15px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    border-radius:5px;
}
/* CARRITO */
.carrito{
    position:fixed;
    right:0;
    top:0;
    width:260px;
    height:100%;
    background:white;
    border-left:1px solid #eee;
    padding:20px;
}
.total{
    margin-top:20px;
    font-weight:bold;
}
/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#25D366;
    color:white;
    padding:15px 18px;
    border-radius:50px;
    font-size:16px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>
<body>
<div class="top-banner">20% OFF en tu primera compra</div>
<header>
<div class="logo">Nova Store</div>
<nav>
<a href="#">Inicio</a>
<a href="#">Tienda</a>
</nav>
</header>
<section class="hero">
<h1>Encontrá lo que buscás</h1>
<input class="search-box" placeholder="Buscar productos...">
</section>
<section class="productos">
<div class="card">
<img src="https://images.unsplash.com/photo-1606220588913-b3aacb4d2f37">
<div class="card-content">
<h3>Auriculares inalámbricos</h3>
<p class="precio">$25.000</p>
<button class="btn" onclick="agregar('Auriculares',25000)">Agregar</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1579586337278-3f436f25d4d6">
<div class="card-content">
<h3>Smartwatchs</h3>
<p class="precio">$40.000</p>
<button class="btn" onclick="agregar('Smartwatchs',40000)">Agregar</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1593642634367-d91a135587b5">
<div class="card-content">
<h3>Mousepad XL 80x40</h3>
<p class="precio">$10.000</p>
<button class="btn" onclick="agregar('Mousepad',10000)">Agregar</button>
</div>
</div>
</section>
<div class="carrito">
<h3>Carrito</h3>
<div id="lista"></div>
<div class="total" id="total">Total: $0</div>
</div>
<a class="whatsapp" href="https://wa.me/549XXXXXXXXXX" target="_blank">
WhatsApp
</a>
<script>
let carrito = [];
let total = 0;
function agregar(nombre,precio){
    carrito.push({nombre,precio});
    total += precio;
    render();
}
function render(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    carrito.forEach(item=>{
        lista.innerHTML += `<div>${item.nombre} - $${item.precio}</div>`;
    });
    document.getElementById("total").innerText = "Total: $" + total;
}
</script>
</body>
</html>
