<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Store</title>

<style>

*{
box-sizing:border-box;
font-family: 'Segoe UI', Arial, sans-serif;
}

body{
margin:0;
background:#f7f7f7;
color:#222;
}

/* HEADER */

header{
background:#111;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:bold;
}

#botonCarrito{
background:#00c853;
border:none;
padding:14px 20px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
font-size:16px;
}

/* BANNER */

.banner{
background:#e0e0e0;
text-align:center;
padding:20px;
font-size:20px;
font-weight:bold;
}

/* ZONA VIDEO */

.video-box{
margin:30px auto;
width:90%;
max-width:800px;
height:250px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
color:#666;
font-size:18px;
}

/* BUSCADOR */

#buscador{
display:block;
width:90%;
max-width:600px;
margin:20px auto;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
}

/* PRODUCTOS */

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.producto{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px #0001;
transition:.3s;
cursor:pointer;
}

.producto:hover{
transform:translateY(-5px);
}

.producto img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.producto h3{
margin:10px 0;
}

/* CARRITO GRANDE */

#ventanaCarrito{

position:fixed;
right:0;
top:0;

width:340px;
height:100vh;

background:white;

box-shadow:-5px 0 20px #0003;

padding:20px;

display:none;

overflow:auto;

}

#ventanaCarrito h2{
margin-top:0;
}

.item{
display:flex;
gap:10px;
margin-bottom:15px;
}

.item img{
width:60px;
height:60px;
border-radius:10px;
}

.item button{
margin-top:5px;
}

/* BOTONES */

.boton{
width:100%;
padding:12px;
border:none;
background:#111;
color:white;
border-radius:10px;
cursor:pointer;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
bottom:20px;
left:20px;
background:#25d366;
color:white;
padding:15px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<div class="logo">🛒 Nova Store</div>

<button id="botonCarrito" onclick="abrirCarrito()">
🛒 Carrito (<span id="contador">0</span>)
</button>

</header>

<div class="banner">
🔥 20% DE DESCUENTO EN TODO 🔥
</div>

<!-- VIDEO -->
<div class="video-box">
(Acá después vas a poner tu video)
</div>

<input id="buscador" placeholder="🔎 Buscar productos...">

<!-- PRODUCTOS ABAJO -->
<div class="productos">

<div class="producto" onclick="agregar('Reloj Inteligente',20000)">
<img src="https://via.placeholder.com/300">
<h3>Reloj Inteligente</h3>
</div>

<div class="producto" onclick="agregar('Auriculares Bluetooth',20000)">
<img src="https://via.placeholder.com/300">
<h3>Auriculares Bluetooth</h3>
</div>

<div class="producto" onclick="agregar('Teclado Gamer',60000)">
<img src="https://via.placeholder.com/300">
<h3>Teclado Gamer</h3>
</div>

<div class="producto" onclick="agregar('Funda Celular',10000)">
<img src="https://via.placeholder.com/300">
<h3>Funda Celular</h3>
</div>

<div class="producto" onclick="agregar('Cargador Rápido',8000)">
<img src="https://via.placeholder.com/300">
<h3>Cargador Rápido</h3>
</div>

<div class="producto" onclick="agregar('Mousepad Gamer',6000)">
<img src="https://via.placeholder.com/300">
<h3>Mousepad Gamer</h3>
</div>

</div>

<!-- CARRITO -->

<div id="ventanaCarrito">

<h2>🛒 Tu carrito</h2>

<div id="lista"></div>

<h3>Total: $<span id="total">0</span></h3>

<button onclick="cerrarCarrito()">Cerrar</button>

</div>

<a class="whatsapp" href="#">WhatsApp</a>

<script>

let carrito=[];

function agregar(nombre,precio){
carrito.push({nombre,precio});
mostrar();
}

function mostrar(){
let lista=document.getElementById("lista");
lista.innerHTML="";

let total=0;

carrito.forEach(p=>{
let div=document.createElement("div");
div.className="item";

div.innerHTML=`
<img src="https://via.placeholder.com/100">
<div>
<b>${p.nombre}</b><br>
$${p.precio}
</div>
`;

lista.appendChild(div);
total+=p.precio;
});

document.getElementById("total").textContent=total;
document.getElementById("contador").textContent=carrito.length;
}

function abrirCarrito(){
document.getElementById("ventanaCarrito").style.display="block";
}

function cerrarCarrito(){
document.getElementById("ventanaCarrito").style.display="none";
}

</script>

</body>
</html>
