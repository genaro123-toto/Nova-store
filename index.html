<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenSur</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}
.logo {
  font-size: 32px;
  font-weight: bold;
}
#buscador {
  padding: 10px;
  width: 50%;
  border-radius: 20px;
  border: 1px solid #ccc;
}
/* BANNER */
.banner-descuento {
  background-color: black;
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: bold;
}
/* SECCIÓN */
.seccion-descuento {
  background-color: #F5EFE6;
  padding: 30px;
}
/* HERO */
.hero img {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 30px;
}
/* PRODUCTOS */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.producto {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}
/* IMÁGENES */
.producto img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
}
/* PRECIO */
.precio-original {
  font-size: 18px;
}
.precio-tachado {
  text-decoration: line-through;
  color: gray;
}
.precio-nuevo {
  font-size: 20px;
  font-weight: bold;
  color: green;
}
/* ETIQUETA DESCUENTO */
.badge {
  background: black;
  color: white;
  font-size: 12px;
  padding: 3px 6px;
  border-radius: 5px;
  display: inline-block;
  margin-top: 5px;
}
/* BOTÓN DESCUENTO */
.btn-descuento {
  margin-top: 10px;
  padding: 6px 10px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}
.btn-descuento.usado {
  background: #ccc;
  color: #666;
  border: 1px solid #999;
  cursor: not-allowed;
}
/* BOTÓN WSP */
.btn-wsp {
  display: inline-block;
  margin-top: 10px;
  padding: 10px;
  background-color: white;
  color: black;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  border: 2px solid black;
}
/* MOBILE */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    gap: 10px;
  }
  #buscador {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">VenSur</div>
  <input type="text" id="buscador" placeholder="Buscar productos..." onkeyup="buscarProductos()">
</div>
<div class="banner-descuento">
  20% de descuento en tu primera compra
</div>
<div class="seccion-descuento">
  <!-- HERO -->
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1544117519-31a4b719223d">
  </div>
  <div class="productos">
<!-- AURICULARES -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1606220588913-b3aacb4d2f46">
  <h3>Auriculares Inalámbricos</h3>
  <div id="p1" class="precio-original">$15.000</div>
  <button class="btn-descuento" onclick="aplicarDescuento('p1',15000,this)">
    Aplicar descuento →
  </button>
  <div id="badge1"></div>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
<!-- SMARTWATCH -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1544117519-31a4b719223d">
  <h3>Smartwatches</h3>
  <div id="p2" class="precio-original">$25.000</div>
  <button class="btn-descuento" onclick="aplicarDescuento('p2',25000,this)">
    Aplicar descuento →
  </button>
  <div id="badge2"></div>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
<!-- FUNDAS -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1601597111158-2fceff292cdc">
  <h3>Fundas para Celular</h3>
  <div id="p3" class="precio-original">$10.000</div>
  <button class="btn-descuento" onclick="aplicarDescuento('p3',10000,this)">
    Aplicar descuento →
  </button>
  <div id="badge3"></div>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
  </div>
</div>
<script>
function buscarProductos() {
  let input = document.getElementById("buscador").value.toLowerCase();
  let productos = document.querySelectorAll(".producto");
  productos.forEach(p => {
    let texto = p.innerText.toLowerCase();
    p.style.display = texto.includes(input) ? "block" : "none";
  });
}
function aplicarDescuento(id, base, boton) {
  if (boton.classList.contains("usado")) return;
  let precio = document.getElementById(id);
  let badge = document.getElementById("badge" + id.replace("p",""));
  let nuevo = base * 0.8;
  precio.innerHTML = 
    '<span class="precio-tachado">$' + base.toLocaleString() + '</span><br>' +
    '<span class="precio-nuevo">$' + Math.round(nuevo).toLocaleString() + '</span>';
  badge.innerHTML = '<div class="badge">-20% aplicado</div>';
  boton.classList.add("usado");
  boton.innerText = "Descuento aplicado";
}
</script>
</body>
</html>
