<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}

.logo {
  font-size: 32px;
  font-weight: bold;
}

#buscador {
  padding: 10px;
  width: 50%;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* BANNER NEGRO */
.banner-descuento {
  background-color: black;
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: bold;
}

/* SECCIÓN COLOR */
.seccion-descuento {
  background-color: #F5EFE6;
  padding: 30px;
}

/* HERO */
.hero img {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 30px;
}

/* PRODUCTOS */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.producto {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  transition: 0.2s;
}

.producto:hover {
  transform: scale(1.03);
}

.producto img {
  width: 100%;
  border-radius: 10px;
}

/* BOTÓN */
.btn-wsp {
  display: inline-block;
  margin-top: 10px;
  padding: 10px;
  background-color: #25D366;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
}

/* 📱 MEJORA MOBILE */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    gap: 10px;
  }

  #buscador {
    width: 100%;
  }

  .logo {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Nova Store</div>
  <input type="text" id="buscador" placeholder="Buscar productos..." onkeyup="buscarProductos()">
</div>

<!-- BANNER -->
<div class="banner-descuento">
  20% de descuento en tu primera compra
</div>

<!-- CONTENIDO -->
<div class="seccion-descuento">

  <!-- HERO -->
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1518444065439-e933c06ce9cd">
  </div>

  <!-- PRODUCTOS -->
  <div class="productos">

    <!-- AURICULARES -->
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
      <h3>Auriculares Inalámbricos</h3>
      <p>$16.000</p>
      <a class="btn-wsp" href="https://wa.me/5492964609317?text=Hola,%20vi%20los%20auriculares%20inal%C3%A1mbricos%20en%20Nova%20Store%20y%20me%20interesan.%20Quisiera%20saber%20si%20tienen%20stock,%20qué%20colores%20hay%20disponibles,%20cómo%20es%20la%20duración%20de%20la%20batería%20y%20si%20realizan%20envíos%20en%20Río%20Grande.%20Gracias.">
        Consultar por WhatsApp
      </a>
    </div>

    <!-- SMARTWATCH -->
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b">
      <h3>Smartwatch S</h3>
      <p>$20.000</p>
      <a class="btn-wsp" href="https://wa.me/5492964609317?text=Hola,%20estuve%20viendo%20el%20Smartwatch%20S%20en%20tu%20tienda%20y%20me%20gustó.%20Quisiera%20consultar%20por%20las%20funciones,%20compatibilidad,%20batería%20y%20disponibilidad%20para%20Río%20Grande.">
        Consultar por WhatsApp
      </a>
    </div>

    <!-- MOUSEPAD -->
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7">
      <h3>Mousepad Pro</h3>
      <p>$25.000</p>
      <a class="btn-wsp" href="https://wa.me/5492964609317?text=Hola,%20vi%20el%20mousepad%20y%20me%20interesa.%20Quisiera%20saber%20medidas,%20material,%20stock%20y%20envío.">
        Consultar por WhatsApp
      </a>
    </div>

    <!-- FUNDA (NUEVO) -->
    <div class="producto">
      <img src="https://images.unsplash.com/photo-1601597111158-2fceff292cdc">
      <h3>Funda para Celular</h3>
      <p>$18.000</p>
      <a class="btn-wsp" href="https://wa.me/5492964609317?text=Hola,%20vi%20las%20fundas%20para%20celular%20en%20Nova%20Store%20y%20me%20interesan.%20Quisiera%20saber%20para%20qué%20modelos%20tenés,%20colores%20disponibles,%20material%20y%20si%20hay%20stock%20para%20envío%20en%20Río%20Grande.">
        Consultar por WhatsApp
      </a>
    </div>

  </div>

</div>

<script>
function buscarProductos() {
  let input = document.getElementById("buscador").value.toLowerCase();
  let productos = document.querySelectorAll(".producto");

  productos.forEach(p => {
    let texto = p.innerText.toLowerCase();
    p.style.display = texto.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
