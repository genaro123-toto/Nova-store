<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Minimal</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Arial', sans-serif;
}
body{
    background:#ffffff;
    color:#111;
}
/* NAV */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}
.logo{
    font-weight:bold;
    font-size:20px;
}
nav a{
    margin-left:20px;
    text-decoration:none;
    color:#555;
}
nav a:hover{
    color:#000;
}
/* HERO estilo Google */
.hero{
    height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.hero h1{
    font-size:40px;
    font-weight:500;
    margin-bottom:20px;
}
.search-box{
    width:500px;
    max-width:90%;
    padding:15px;
    border-radius:30px;
    border:1px solid #ddd;
    outline:none;
    font-size:16px;
    transition:0.3s;
}
.search-box:focus{
    border-color:#c8a27c;
}
/* PRODUCTOS */
.productos{
    padding:60px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:40px;
}
.card{
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
}
.card:hover{
    transform:translateY(-5px);
}
.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}
.card-content{
    padding:15px 5px;
}
.card h3{
    font-size:18px;
    margin-bottom:5px;
}
.precio{
    color:#c8a27c; /* tono madera */
    margin-bottom:10px;
}
.btn{
    padding:8px 15px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    border-radius:5px;
    font-size:14px;
}
/* CARRITO */
.carrito{
    position:fixed;
    right:0;
    top:0;
    width:280px;
    height:100%;
    background:white;
    border-left:1px solid #eee;
    padding:20px;
}
.item{
    margin-bottom:10px;
    font-size:14px;
}
.total{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>
<body>
<header>
<div class="logo">Minimal Store</div>
<nav>
<a href="#">Inicio</a>
<a href="#">Tienda</a>
</nav>
</header>
<section class="hero">
<h1>Encontrá lo que buscás</h1>
<input class="search-box" placeholder="Buscar productos...">
</section>
<section class="productos">
<div class="card">
<img src="https://images.unsplash.com/photo-1518441902112-f5b0c9c1c7b2">
<div class="card-content">
<h3>Auriculares</h3>
<p class="precio">$25.000</p>
<button class="btn" onclick="agregar('Auriculares',25000)">Agregar</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12">
<div class="card-content">
<h3>Smartwatchs</h3>
<p class="precio">$40.000</p>
<button class="btn" onclick="agregar('Smartwatchs',40000)">Agregar</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7">
<div class="card-content">
<h3>Mousepad</h3>
<p class="precio">$10.000</p>
<button class="btn" onclick="agregar('Mousepad',10000)">Agregar</button>
</div>
</div>
</section>
<div class="carrito">
<h3>Carrito</h3>
<div id="lista"></div>
<div class="total" id="total">Total: $0</div>
</div>
<script>
let carrito = [];
let total = 0;
function agregar(nombre,precio){
    carrito.push({nombre,precio});
    total += precio;
    render();
}
function render(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    carrito.forEach(item=>{
        lista.innerHTML += `<div class="item">${item.nombre} - $${item.precio}</div>`;
    });
    document.getElementById("total").innerText = "Total: $" + total;
}
</script>
</body>
</html>
