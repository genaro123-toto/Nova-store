<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}
body{
    background:#fff;
    color:#111;
}
/* NAV */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}
.logo{
    font-weight:bold;
    font-size:30px;
    letter-spacing:2px;
    background:linear-gradient(90deg,#111,#c8a27c);
    -webkit-background-clip:text;
    color:transparent;
}
nav a{
    margin-left:20px;
    text-decoration:none;
    color:#555;
}
/* HERO */
.hero{
    height:45vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding-top:50px;
    text-align:center;
}
.hero h1{
    font-size:34px;
    margin-bottom:15px;
}
.search-box{
    width:450px;
    max-width:90%;
    padding:14px;
    border-radius:30px;
    border:1px solid #ddd;
}
/* BANNER DESCUENTO (nuevo lugar) */
.banner-descuento{
    margin:20px auto 10px;
    width:fit-content;
    background:#111;
    color:#fff;
    padding:8px 20px;
    border-radius:20px;
    font-size:14px;
}
/* PRODUCTOS */
.productos{
    padding:10px 40px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:40px;
}
.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:10px;
}
/* PRECIOS */
.precio-antiguo{
    text-decoration:line-through;
    color:#888;
    font-size:14px;
}
.precio{
    color:#c8a27c;
    font-weight:bold;
    font-size:18px;
}
.btn{
    margin-top:10px;
    padding:8px 15px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    border-radius:5px;
}
/* CARRITO */
.carrito{
    position:fixed;
    right:0;
    top:0;
    width:260px;
    height:100%;
    background:white;
    border-left:1px solid #eee;
    padding:20px;
}
.total{
    margin-top:20px;
    font-weight:bold;
}
/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#25D366;
    color:white;
    padding:16px 20px;
    border-radius:50px;
    font-size:17px;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>
<body>
<header>
<div class="logo">Nova Store</div>
<nav>
<a href="#">Inicio</a>
<a href="#">Tienda</a>
</nav>
</header>
<section class="hero">
<h1>Encontrá lo que buscás</h1>
<input class="search-box" placeholder="Buscar productos...">
</section>
<div class="banner-descuento">20% OFF en tu primera compra</div>
<section class="productos">
<div class="card">
<img src="https://images.unsplash.com/photo-1606220588913-b3aacb4d2f37">
<h3>Auriculares inalámbricos</h3>
<p class="precio-antiguo">$20.000</p>
<p class="precio">$16.000</p>
<button class="btn" onclick="agregar('Auriculares',16000)">Agregar</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1579586337278-3f436f25d4d6">
<h3>Smartwatchs</h3>
<p class="precio-antiguo">$25.000</p>
<p class="precio">$20.000</p>
<button class="btn" onclick="agregar('Smartwatchs',20000)">Agregar</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1593642634367-d91a135587b5">
<h3>Mousepad XL 80x40</h3>
<p class="precio-antiguo">$27.000</p>
<p class="precio">$25.000</p>
<button class="btn" onclick="agregar('Mousepad',25000)">Agregar</button>
</div>
</section>
<div class="carrito">
<h3>Carrito</h3>
<div id="lista"></div>
<div class="total" id="total">Total: $0</div>
</div>
<a class="whatsapp" href="https://wa.me/542964609317" target="_blank">
WhatsApp
</a>
<script>
let carrito = [];
let total = 0;
function agregar(nombre,precio){
    carrito.push({nombre,precio});
    total += precio;
    render();
}
function render(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    carrito.forEach(item=>{
        lista.innerHTML += `<div>${item.nombre} - $${item.precio}</div>`;
    });
    document.getElementById("total").innerText = "Total: $" + total;
}
</script>
</body>
</html>
