<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenSur</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
}
.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 1px;
}
#buscador {
  padding: 10px;
  width: 40%;
  border-radius: 20px;
  border: 1px solid #ccc;
}
/* ICONO WHATSAPP */
.wsp-header {
  font-size: 22px;
  text-decoration: none;
}
/* BANNER */
.banner-descuento {
  background-color: black;
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: bold;
}
/* SECCIÓN */
.seccion-descuento {
  background-color: #F5EFE6;
  padding: 30px;
}
/* HERO */
.hero img {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 30px;
}
/* PRODUCTOS */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.producto {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}
.producto img {
  width: 100%;
  height: 150px;
  object-fit: contain;
  border-radius: 10px;
  background: white;
}
/* PRECIO */
.precio {
  margin-top: 10px;
}
.precio-viejo {
  text-decoration: line-through;
  color: gray;
}
.precio-nuevo {
  font-weight: bold;
}
/* BOTÓN DESCUENTO */
.btn-descuento {
  margin-top: 10px;
  padding: 6px 10px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}
.btn-descuento.usado {
  background: #ccc;
  color: #666;
  cursor: not-allowed;
}
/* BADGE */
.badge {
  display: inline-block;
  margin-left: 8px;
  font-size: 12px;
  color: green;
  font-weight: bold;
}
/* BOTÓN WSP */
.btn-wsp {
  display: inline-block;
  margin-top: 10px;
  padding: 10px;
  background-color: #25D366;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
}
/* MOBILE */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    gap: 10px;
  }
  #buscador {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">VenSur</div>
  <input type="text" id="buscador" placeholder="Buscar productos..." onkeyup="buscarProductos()">

💬

</div>
<div class="banner-descuento">
  20% de descuento en tu primera compra
</div>
<div class="seccion-descuento">
  <div class="hero">
    <img src="https://images.unsplash.com/photo-1544117519-31a4b719223d">
  </div>
  <div class="productos">
<!-- AURICULARES -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df">
  <h3>Auriculares Inalámbricos</h3>
  <div class="precio" id="p1">
    <span class="precio-viejo">$15.000</span><br>
    <span class="precio-nuevo">$12.000</span>
  </div>
  <button class="btn-descuento" onclick="aplicar(this,'p1')">
    Aplicar descuento →
  </button>
  <span id="b1"></span>
  <br>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
<!-- SMARTWATCH -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1544117519-31a4b719223d">
  <h3>Smartwatches</h3>
  <div class="precio" id="p2">
    <span class="precio-viejo">$25.000</span><br>
    <span class="precio-nuevo">$20.000</span>
  </div>
  <button class="btn-descuento" onclick="aplicar(this,'p2')">
    Aplicar descuento →
  </button>
  <span id="b2"></span>
  <br>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
<!-- FUNDAS -->
<div class="producto">
  <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505">
  <h3>Fundas para Celular</h3>
  <div class="precio" id="p3">
    <span class="precio-viejo">$10.000</span><br>
    <span class="precio-nuevo">$8.000</span>
  </div>
  <button class="btn-descuento" onclick="aplicar(this,'p3')">
    Aplicar descuento →
  </button>
  <span id="b3"></span>
  <br>
  <a class="btn-wsp" href="#">Consultar</a>
</div>
  </div>
</div>
<script>
function buscarProductos() {
  let input = document.getElementById("buscador").value.toLowerCase();
  let productos = document.querySelectorAll(".producto");
  productos.forEach(p => {
    let texto = p.innerText.toLowerCase();
    p.style.display = texto.includes(input) ? "block" : "none";
  });
}
function aplicar(btn, id) {
  if(btn.classList.contains("usado")) return;
  btn.classList.add("usado");
  btn.innerText = "Aplicado";
  let badge = document.getElementById("b" + id.replace("p",""));
  badge.innerHTML = '<span class="badge">✔ -20% aplicado</span>';
}
</script>
</body>
</html>
