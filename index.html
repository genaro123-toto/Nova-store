<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Store</title>

<style>

*{
box-sizing:border-box;
font-family: 'Segoe UI', Arial, sans-serif;
}

body{
margin:0;
background:#f4f5f7;
color:#222;
}

/* HEADER */

header{
background:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px #0001;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:22px;
font-weight:bold;
}

#botonCarrito{
background:#111;
color:white;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
}

/* HERO */

.hero{
padding:60px 20px;
text-align:center;
}

.hero h1{
font-size:30px;
margin-bottom:10px;
}

.hero p{
color:#555;
}

/* DESTACADO (tipo espacio para video o imagen grande) */

.destacado{
width:90%;
max-width:900px;
height:260px;
background:#ddd;
margin:30px auto;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
color:#666;
}

/* BUSCADOR */

#buscador{
display:block;
width:90%;
max-width:500px;
margin:20px auto;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}

/* PRODUCTOS */

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:30px;
}

.producto{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 12px #0001;
transition:.3s;
cursor:pointer;
}

.producto:hover{
transform:translateY(-5px);
}

.producto img{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
}

.producto h3{
margin:10px 0;
}

/* CARRITO */

#carrito{
position:fixed;
right:0;
top:0;
width:320px;
height:100vh;
background:white;
box-shadow:-5px 0 20px #0002;
padding:20px;
display:none;
overflow:auto;
}

.item{
display:flex;
gap:10px;
margin-bottom:15px;
}

.item img{
width:50px;
height:50px;
border-radius:8px;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
bottom:20px;
left:20px;
background:#25d366;
color:white;
padding:14px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<div class="logo">Nova Store</div>
<button id="botonCarrito" onclick="abrirCarrito()">
🛒 (<span id="contador">0</span>)
</button>
</header>

<div class="hero">
<h1>Comprá tecnología fácil</h1>
<p>Productos confiables, precios claros</p>
</div>

<div class="destacado">
(Acá va tu video o imagen grande)
</div>

<input id="buscador" placeholder="Buscar productos...">

<div class="productos">

<div class="producto" onclick="agregar('Reloj Inteligente',20000)">
<img src="https://via.placeholder.com/300">
<h3>Reloj Inteligente</h3>
</div>

<div class="producto" onclick="agregar('Auriculares',20000)">
<img src="https://via.placeholder.com/300">
<h3>Auriculares</h3>
</div>

<div class="producto" onclick="agregar('Teclado Gamer',60000)">
<img src="https://via.placeholder.com/300">
<h3>Teclado Gamer</h3>
</div>

<div class="producto" onclick="agregar('Funda Celular',10000)">
<img src="https://via.placeholder.com/300">
<h3>Funda Celular</h3>
</div>

<div class="producto" onclick="agregar('Cargador',8000)">
<img src="https://via.placeholder.com/300">
<h3>Cargador Rápido</h3>
</div>

<div class="producto" onclick="agregar('Mousepad',6000)">
<img src="https://via.placeholder.com/300">
<h3>Mousepad Gamer</h3>
</div>

</div>

<div id="carrito">
<h2>Carrito</h2>
<div id="lista"></div>
<h3>Total: $<span id="total">0</span></h3>
<button onclick="cerrarCarrito()">Cerrar</button>
</div>

<a class="whatsapp" href="#">WhatsApp</a>

<script>

let carrito=[];

function agregar(nombre,precio){
carrito.push({nombre,precio});
mostrar();
}

function mostrar(){
let lista=document.getElementById("lista");
lista.innerHTML="";
let total=0;

carrito.forEach(p=>{
let div=document.createElement("div");
div.className="item";

div.innerHTML=`
<img src="https://via.placeholder.com/100">
<div>
<b>${p.nombre}</b><br>
$${p.precio}
</div>
`;

lista.appendChild(div);
total+=p.precio;
});

document.getElementById("total").textContent=total;
document.getElementById("contador").textContent=carrito.length;
}

function abrirCarrito(){
document.getElementById("carrito").style.display="block";
}

function cerrarCarrito(){
document.getElementById("carrito").style.display="none";
}

</script>

</body>
</html>
