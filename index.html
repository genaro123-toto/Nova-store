<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VenSur</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f5efe6;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background-color: white;
}

.logo {
  font-size: 32px;
  font-weight: bold;
}

#buscador {
  padding: 10px 15px;
  width: 50%;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 15px;
}

#buscador:focus {
  border-color: #000;
}

/* BANNER */
.banner-descuento {
  background-color: black;
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: bold;
}

/* SECCIÓN */
.seccion-descuento {
  padding: 30px;
}

/* HERO */
.hero {
  margin-bottom: 30px;
}

.hero img {
  width: 100%;
  height: 350px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}

/* PRODUCTOS */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.producto {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

/* IMÁGENES DE PRODUCTOS */
.producto img {
  width: 100%;
  height: 175px;
  object-fit: contain;
  background-color: white;
  border-radius: 10px;
  display: block;
}

/* PRECIO */
.precio-original {
  font-size: 18px;
  margin-top: 10px;
}

.precio-tachado {
  text-decoration: line-through;
  color: gray;
}

.precio-nuevo {
  font-size: 20px;
  font-weight: bold;
  color: green;
}

/* ETIQUETA DESCUENTO */
.badge {
  background: black;
  color: white;
  font-size: 12px;
  padding: 3px 6px;
  border-radius: 5px;
  display: inline-block;
  margin-top: 5px;
}

/* BOTÓN DESCUENTO */
.btn-descuento {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
  border-radius: 5px;
}

.btn-descuento:hover {
  background: black;
  color: white;
}

.btn-descuento.usado {
  background: #ccc;
  color: #666;
  border: 1px solid #999;
  cursor: not-allowed;
}

/* BOTÓN WHATSAPP */
.btn-wsp {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 15px;
  background-color: white;
  color: black;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  border: 2px solid black;
}

.btn-wsp:hover {
  background-color: black;
  color: white;
}

/* MOBILE */
@media (max-width: 600px) {

  .header {
    flex-direction: column;
    gap: 10px;
  }

  #buscador {
    width: 90%;
  }

  .seccion-descuento {
    padding: 15px;
  }

  .hero img {
    height: 220px;
  }

  .producto img {
    height: 175px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="logo">
    VenSur
  </div>

  <input
    type="text"
    id="buscador"
    placeholder="Buscar productos..."
    oninput="buscarProductos()"
  >

</div>


<!-- BANNER -->
<div class="banner-descuento">
  20% de descuento en tu primera compra
</div>


<!-- SECCIÓN -->
<div class="seccion-descuento">

  <!-- HERO -->
  <div class="hero">

    <!-- ESTA IMAGEN VIENE DE TU CARPETA -->
    <img
      src="auriculares-vensur.jpg"
      alt="Auriculares VenSur"
    >

  </div>


  <!-- PRODUCTOS -->
  <div class="productos">


    <!-- AURICULARES -->
    <div class="producto">

      <img
        src="auriculares-vensur.jpg"
        alt="Auriculares inalámbricos"
      >

      <h3>
        Auriculares Inalámbricos
      </h3>

      <div id="p1" class="precio-original">
        $20.000
      </div>

      <button
        class="btn-descuento"
        onclick="aplicarDescuento('p1', 20000, this)"
      >
        Aplicar descuento →
      </button>

      <div id="badge1"></div>

      <a
        class="btn-wsp"
        href="#"
      >
        Consultar
      </a>

    </div>


    <!-- SMARTWATCH -->
    <div class="producto">

      <img
        src="https://images.unsplash.com/photo-1544117519-31a4b719223d"
        alt="Smartwatch"
      >

      <h3>
        Smartwatches
      </h3>

      <div id="p2" class="precio-original">
        $25.000
      </div>

      <button
        class="btn-descuento"
        onclick="aplicarDescuento('p2', 25000, this)"
      >
        Aplicar descuento →
      </button>

      <div id="badge2"></div>

      <a
        class="btn-wsp"
        href="#"
      >
        Consultar
      </a>

    </div>


    <!-- FUNDAS -->
    <div class="producto">

      <img
        src="https://shoplineimg.com/64b5f982f861d40067631464/654216057e49d7001d2ac4e3/800x.png"
        alt="Funda transparente MagSafe para iPhone"
      >

      <h3>
        Fundas para Celular
      </h3>

      <div id="p3" class="precio-original">
        $12.000
      </div>

      <button
        class="btn-descuento"
        onclick="aplicarDescuento('p3', 12000, this)"
      >
        Aplicar descuento →
      </button>

      <div id="badge3"></div>

      <a
        class="btn-wsp"
        href="#"
      >
        Consultar
      </a>

    </div>

  </div>

</div>


<script>

/* =========================
   BUSCADOR
========================= */

function buscarProductos() {

  const input = document
    .getElementById("buscador")
    .value
    .toLowerCase()
    .trim();

  const productos =
    document.querySelectorAll(".producto");

  productos.forEach(producto => {

    const nombre =
      producto
        .querySelector("h3")
        .textContent
        .toLowerCase();

    if (nombre.includes(input)) {

      producto.style.display = "";

    } else {

      producto.style.display = "none";

    }

  });

}


/* =========================
   DESCUENTO
========================= */

function aplicarDescuento(id, base, boton) {

  if (boton.classList.contains("usado")) {
    return;
  }

  const precio =
    document.getElementById(id);

  const numeroBadge =
    id.replace("p", "");

  const badge =
    document.getElementById(
      "badge" + numeroBadge
    );

  const nuevo =
    base * 0.8;


  precio.innerHTML =

    '<span class="precio-tachado">$' +
    base.toLocaleString("es-AR") +
    '</span><br>' +

    '<span class="precio-nuevo">$' +
    Math.round(nuevo).toLocaleString("es-AR") +
    '</span>';


  badge.innerHTML =
    '<div class="badge">-20% aplicado</div>';


  boton.classList.add("usado");

  boton.innerText =
    "Descuento aplicado";

}

</script>

</body>
</html>
