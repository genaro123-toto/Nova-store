<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #111;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #00ffcc;
}

nav button {
  background: #00ffcc;
  border: none;
  padding: 8px 15px;
  cursor: pointer;
  border-radius: 5px;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(180deg, #111, #0f0f0f);
}

.hero h1 {
  font-size: 40px;
}

.hero p {
  color: #aaa;
}

.hero button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #00ffcc;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

/* PRODUCTOS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
  padding: 40px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 10px;
  transition: 0.3s;
  border: 1px solid #222;
}

.card:hover {
  transform: translateY(-5px);
  border: 1px solid #00ffcc;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.price {
  color: #00ffcc;
  font-size: 18px;
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #00ffcc;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  border-top: 1px solid #222;
  color: #777;
}
</style>
</head>

<body>

<nav>
  <div class="logo">GEN STORE</div>
  <button>Carrito 🛒</button>
</nav>

<section class="hero">
  <h1>Productos Tech que valen la pena</h1>
  <p>Envíos a todo el país • Garantía • Ofertas limitadas</p>
  <button>Ver productos</button>
</section>

<section class="products">

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="">
    <h3>Smartwatchs</h3>
    <p class="price">$25.000</p>
    <button>Agregar al carrito</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="">
    <h3>Auriculares</h3>
    <p class="price">$18.000</p>
    <button>Agregar al carrito</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="">
    <h3>Mousepad</h3>
    <p class="price">$6.000</p>
    <button>Agregar al carrito</button>
  </div>

</section>

<footer>
  © 2026 Gen Store - Todos los derechos reservados
</footer>

</body>
</html>
